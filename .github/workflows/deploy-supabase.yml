name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          cd supabase
          
          # Deploy all edge functions
          supabase functions deploy delete-user-account --project-ref $SUPABASE_PROJECT_ID
          supabase functions deploy revenuecat-webhook --project-ref $SUPABASE_PROJECT_ID
          supabase functions deploy revenuecat-api --project-ref $SUPABASE_PROJECT_ID
          
          echo "✅ All edge functions deployed successfully!"

      - name: Notify Deployment
        if: success()
        run: |
          echo "🚀 Supabase Edge Functions deployed to production"
          echo "Timestamp: $(date)"
